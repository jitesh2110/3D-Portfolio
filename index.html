<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Portfolio | Day/Night Toggle</title>
    <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.159.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.159.0/examples/jsm/"
        }
    }
    </script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: sans-serif;
        }
        canvas { 
            display: block; 
        }
        #toggle-button {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #ffffff;
            color: #1c1c1c;
            border: 2px solid #1c1c1c;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            z-index: 100;
            transition: background-color 0.3s, color 0.3s;
        }
        #back-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            padding: 10px 20px;
            background-color: #ffffff;
            color: #1c1c1c;
            border: 2px solid #1c1c1c;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: none;
            transition: background-color 0.3s, color 0.3s;
        }
        #root {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
